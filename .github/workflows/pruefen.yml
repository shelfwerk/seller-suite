name: pruefen

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Claude Code CLI (nur für 'plugin validate', kein API-Schlüssel nötig)
        run: npm install -g @anthropic-ai/claude-code
      - name: Prüfen
        run: bash tools/pruefen.sh
